name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repo to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .git --exclude .tanstack --exclude .lovable \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/portfolio/

      - name: Build & restart containers
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash -se <<'EOSSH'
            set -e
            cd /srv/portfolio
            cat > .env <<EOF
          VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID=${{ secrets.SUPABASE_PROJECT_ID }}
          LOVABLE_API_KEY=${{ secrets.LOVABLE_API_KEY }}
          EOF
            docker compose up -d --build
            docker compose ps
          EOSSH
